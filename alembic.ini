# Alembic: migrações do PostgreSQL. A conexão vem do .env (app/config.py), não deste arquivo.
#   .venv/bin/alembic upgrade head        aplica as pendentes (a API também faz isso ao subir)
#   .venv/bin/alembic current             revisão aplicada no banco
#   .venv/bin/alembic revision -m "..."   cria api/migracoes/versions/NNNN_....py
[alembic]
script_location = %(here)s/api/migracoes
prepend_sys_path = %(here)s/api
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
